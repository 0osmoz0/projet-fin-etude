map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API workstation (même origine que le hub → shell + lancement GUI)
    location /workstation-api/ {
        proxy_pass http://workstation:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # noVNC + WebSocket (clavier/souris dans l’iframe)
    location /workstation-vnc/ {
        proxy_pass http://workstation:6080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
