<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSINT Workbench</title>
</head>
<body>
  <div class="container">
    <h1 class="osint-title">OSINT Workbench</h1>
    <p class="osint-session"><strong>Session:</strong> OMEGA-OSINT-01</p>

    <div class="browser">
      <div class="toolbar">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
        <input id="urlBar" type="text" placeholder="Requete OSINT (ex: incident auth-gateway, type:scan stack)" />
        <button id="translateBtn" type="button">Traduire: OFF</button>
      </div>
      <div id="view">Indexation en cours...</div>
    </div>

    <div class="footer-links">
      <a href="mail-1.html">&larr; Retour au Mail 1</a>
      <a href="validation.html">Validation OSINT</a>
      <span id="phase2Footer" hidden>
        &middot; <a href="mail-2.html">Mail 2 — Ordre d'infiltration &rarr;</a>
      </span>
    </div>
  </div>
  <script src="assets/js/mission-state.js"></script>
  <script src="assets/js/lab-access.js"></script>
  <script src="assets/js/osint.js"></script>
  <script>
    (function () {
      if (!window.OmegaMissionState || !OmegaMissionState.isValidated()) {
        return;
      }
      const footer = document.getElementById("phase2Footer");
      if (footer) {
        footer.hidden = false;
        if (window.OmegaLabAccess) {
          footer.insertAdjacentHTML(
            "beforeend",
            ` &middot; <a href="${OmegaLabAccess.pivotUrl()}" target="_blank" rel="noopener">Cible lab (${OmegaLabAccess.LAB_PIVOT_PORT}) &rarr;</a>`,
          );
        }
      }
      const session = document.querySelector(".osint-session");
      if (session) {
        session.insertAdjacentHTML(
          "beforeend",
          " &mdash; <strong>Phase 2 (infiltration) active</strong>",
        );
      }
    })();
  </script>
</body>
</html>
