<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>OMEGA-OS · Poste opérateur sécurisé</title>
  <link rel="stylesheet" href="assets/css/hub.css">
  <link rel="stylesheet" href="assets/css/desktop.css?v=deploy2">
</head>
<body>

  <!-- Boot screen terminal-like -->
  <div class="boot-overlay" id="bootOverlay" aria-hidden="true">
    <div class="boot-log" id="bootLog"></div>
    <div class="boot-bar-wrap">
      <div class="boot-bar"><div class="boot-progress" id="bootProgress"></div></div>
      <span class="boot-pct" id="bootPct">0%</span>
    </div>
    <div class="boot-bottom">
      <span class="boot-brand">OMEGA-OS</span>
      <span class="boot-sub">CLASSIFICATION ALPHA · USAGE RESTREINT</span>
    </div>
  </div>

  <!-- Overlay déploiement consoles (phase pivot) -->
  <div class="console-deploy-overlay" id="consoleDeployOverlay" hidden aria-hidden="true">
    <div class="console-deploy-panel">
      <p class="console-deploy-title">Liaison pivot · déploiement</p>
      <p class="console-deploy-msg" id="consoleDeployMsg">Initialisation…</p>
      <div class="console-deploy-bar-wrap">
        <div class="console-deploy-bar" id="consoleDeployBar"></div>
      </div>
    </div>
  </div>

  <!-- Bureau -->
  <div id="desktop" class="desktop">
    <div class="desktop-icons" role="list" aria-label="Applications">

      <!-- SecureMail -->
      <div class="desk-icon" role="listitem" tabindex="0"
           aria-label="SecureMail OMEGA"
           ondblclick="OmegaDesktop.open('mail','SecureMail OMEGA','mail.html',900,580)">
        <div class="icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3,5 12,13 21,5"/></svg>
        </div>
        <span class="icon-label">SecureMail</span>
      </div>

      <!-- Explorateur DOSSIER_OMEGA -->
      <div class="desk-icon" role="listitem" tabindex="0"
           aria-label="DOSSIER_OMEGA"
           ondblclick="OmegaDesktop.open('files','Explorateur — DOSSIER_OMEGA','filemanager.html',960,580)">
        <div class="icon-wrap" aria-hidden="true">
          <!-- icône dossier remplie -->
          <svg viewBox="0 0 24 24" style="fill:#c49a14;stroke:#9a7a0e;stroke-width:1.2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </div>
        <span class="icon-label">DOSSIER<br>OMEGA</span>
      </div>

      <!-- ClearanceForm -->
      <div class="desk-icon" role="listitem" tabindex="0"
           aria-label="ClearanceForm"
           ondblclick="OmegaDesktop.open('valid','ClearanceForm','validation.html?v=cf2',720,660)">
        <div class="icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="14 3 14 9 20 9"/></svg>
        </div>
        <span class="icon-label">ClearanceForm</span>
      </div>

      <!-- Liaison pivot (après validation OSINT) -->
      <div class="desk-icon desk-icon--hidden" role="listitem" tabindex="0"
           id="iconLiaison"
           aria-label="Liaison pivot"
           ondblclick="OmegaDesktop.open('liaison','Liaison pivot','liaison.html',520,480)">
        <div class="icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        </div>
        <span class="icon-label">Liaison<br>pivot</span>
      </div>

      <!-- Alarm Console (masqué jusqu'au jeton pivot) -->
      <div class="desk-icon desk-icon--undeployed" hidden role="listitem" tabindex="-1"
           id="iconAlarm"
           aria-label="Alarm Console"
           data-url=""
           ondblclick="var u=this.dataset.url;if(u)OmegaDesktop.open('alarm','Alarm Console',u,740,520)">
        <div class="icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </div>
        <span class="icon-label">Alarm</span>
      </div>

      <!-- CCTV Console (masqué jusqu'au jeton pivot) -->
      <div class="desk-icon desk-icon--undeployed" hidden role="listitem" tabindex="-1"
           id="iconCctv"
           aria-label="CCTV Console"
           data-url=""
           ondblclick="var u=this.dataset.url;if(u)OmegaDesktop.open('cctv','CCTV Console',u,780,560)">
        <div class="icon-wrap" aria-hidden="true">
          <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        </div>
        <span class="icon-label">CCTV</span>
      </div>

    </div>
  </div>

  <!-- Taskbar -->
  <footer class="taskbar" role="toolbar" aria-label="Barre des tâches">
    <span class="tb-start" role="button" aria-label="OMEGA-OS">OMEGA-OS</span>
    <div class="tb-sep" aria-hidden="true"></div>
    <div class="tb-apps" id="tb-apps" role="list" aria-label="Fenêtres ouvertes"></div>
    <div class="tb-sys">
      <button class="tb-theme" id="themeToggle" aria-label="Basculer thème clair/sombre" title="Thème clair / sombre">◑</button>
      <span class="tb-net" aria-label="Réseau opérationnel">
        <span class="tb-net-dot" aria-hidden="true"></span>
        NET
      </span>
      <span class="tb-classif">ALPHA</span>
      <span class="tb-clock" id="os-clock" aria-label="Heure système">--:--:--</span>
    </div>
  </footer>

  <script src="assets/js/lab-access.js" defer></script>
  <script src="assets/js/mission-state.js" defer></script>
  <script src="assets/js/console-deploy.js?v=deploy2" defer></script>
  <script src="assets/js/desktop.js" defer></script>

  <!-- Thème clair/sombre -->
  <script>
    (function () {
      /* appliquer le thème sauvegardé avant rendu */
      if (localStorage.getItem("omega-theme") === "light") {
        document.documentElement.classList.add("theme-light");
      }
      function updateBtn(isLight) {
        var btn = document.getElementById("themeToggle");
        if (!btn) return;
        btn.textContent = isLight ? "☀" : "◑";
        btn.title = isLight ? "Passer en thème sombre" : "Passer en thème clair";
      }
      updateBtn(document.documentElement.classList.contains("theme-light"));
      document.addEventListener("DOMContentLoaded", function () {
        updateBtn(document.documentElement.classList.contains("theme-light"));
        var btn = document.getElementById("themeToggle");
        if (!btn) return;
        btn.addEventListener("click", function () {
          var isLight = document.documentElement.classList.toggle("theme-light");
          localStorage.setItem("omega-theme", isLight ? "light" : "dark");
          updateBtn(isLight);
        });
      });
    })();
  </script>

  <!-- Boot terminal-like + accessibilité clavier -->
  <script>
    /* ---- Boot animé façon terminal ---- */
    (function () {
      var lines = [
        { cls: "sys",  text: "[    0.000] BIOS v2.4.1 · OMEGA SYSTEMS" },
        { cls: "sys",  text: "[    0.182] Chargement noyau omega-os 5.4.0-lts..." },
        { cls: "ok",   text: "[    0.391] Déchiffrement partition /secure : OK" },
        { cls: "ok",   text: "[    0.514] Module auth-kernel chargé" },
        { cls: "sys",  text: "[    0.628] Vérification intégrité système..." },
        { cls: "ok",   text: "[    0.774] Signature cryptographique : VALIDE" },
        { cls: "warn", text: "[    0.831] AVERTISSEMENT : session classifiée ALPHA" },
        { cls: "ok",   text: "[    0.912] Interface réseau ops0 : active" },
        { cls: "ok",   text: "[    1.044] SecureMail daemon démarré" },
        { cls: "ok",   text: "[    1.103] IntelNode indexation opérationnelle" },
        { cls: "sys",  text: "[    1.210] Chargement session opérateur..." },
      ];

      var log     = document.getElementById("bootLog");
      var bar     = document.getElementById("bootProgress");
      var pct     = document.getElementById("bootPct");
      var overlay = document.getElementById("bootOverlay");
      var total   = lines.length;

      function showLine(i) {
        if (i >= total) {
          /* fin du boot */
          bar.style.transition = "width .2s ease";
          bar.style.width = "100%";
          pct.textContent = "100%";
          setTimeout(function () {
            overlay.style.transition = "opacity .4s ease";
            overlay.style.opacity = "0";
            setTimeout(function () { overlay.remove() }, 420);
          }, 300);
          return;
        }
        var line = document.createElement("div");
        line.className = "boot-log-line " + lines[i].cls;
        line.textContent = lines[i].text;
        log.appendChild(line);
        /* apparition */
        requestAnimationFrame(function () {
          line.style.transition = "opacity .08s";
          line.style.opacity = "1";
        });
        /* avancer la barre */
        var p = Math.round(((i + 1) / total) * 100);
        bar.style.transition = "width .12s linear";
        bar.style.width = p + "%";
        pct.textContent = p + "%";

        var delay = i < 4 ? 90 : i < 8 ? 110 : 140;
        setTimeout(function () { showLine(i + 1) }, delay);
      }

      if (log) setTimeout(function () { showLine(0) }, 80);
    })();

    /* ---- Accessibilité clavier : Enter/Space ouvre une icône ---- */
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      var icon = e.target.closest(".desk-icon");
      if (icon) { e.preventDefault(); icon.dispatchEvent(new MouseEvent("dblclick")); }
    });
  </script>
</body>
</html>
