<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>OMEGA-OS · Poste opérateur sécurisé</title>
  <link rel="stylesheet" href="assets/css/hub.css">
  <link rel="stylesheet" href="assets/css/desktop.css">
</head>
<body>

  <!-- Écran de boot -->
  <div class="boot-overlay" aria-hidden="true">
    <div class="boot-title">OMEGA-OS</div>
    <div class="boot-bar"><div class="boot-progress"></div></div>
    <div class="boot-sub">Initialisation poste opérateur · CLASSIFICATION ALPHA</div>
  </div>

  <!-- Bureau -->
  <div id="desktop" class="desktop">
    <div class="desktop-icons" role="list" aria-label="Applications">

      <div class="desk-icon" role="listitem" tabindex="0"
           aria-label="SecureMail OMEGA"
           ondblclick="OmegaDesktop.open('mail','SecureMail OMEGA','mail.html',900,580)">
        <span class="glyph" aria-hidden="true">✉</span>
        <span class="label">SecureMail<br>OMEGA</span>
      </div>

      <div class="desk-icon" role="listitem" tabindex="0"
           aria-label="IntelNode OSINT"
           ondblclick="OmegaDesktop.open('osint','IntelNode · OSINT','osint.html',980,640)">
        <span class="glyph" aria-hidden="true">🔍</span>
        <span class="label">IntelNode<br>OSINT</span>
      </div>

      <div class="desk-icon" role="listitem" tabindex="0"
           aria-label="ClearanceForm Validation"
           ondblclick="OmegaDesktop.open('valid','ClearanceForm','validation.html',720,660)">
        <span class="glyph" aria-hidden="true">📋</span>
        <span class="label">ClearanceForm</span>
      </div>

      <div class="desk-icon" role="listitem" tabindex="0"
           id="iconAlarm"
           aria-label="Alarm Console"
           data-url=""
           ondblclick="var u=this.dataset.url;if(u)OmegaDesktop.open('alarm','Alarm Console',u,740,520)">
        <span class="glyph" aria-hidden="true">⚠</span>
        <span class="label">Alarm<br>Console</span>
      </div>

      <div class="desk-icon" role="listitem" tabindex="0"
           id="iconCctv"
           aria-label="CCTV Console"
           data-url=""
           ondblclick="var u=this.dataset.url;if(u)OmegaDesktop.open('cctv','CCTV Console',u,780,560)">
        <span class="glyph" aria-hidden="true">📹</span>
        <span class="label">CCTV<br>Console</span>
      </div>

    </div>
  </div>

  <!-- Taskbar -->
  <footer class="taskbar" role="toolbar" aria-label="Barre des tâches">
    <span class="tb-brand" aria-label="OMEGA-OS">OMEGA-OS</span>
    <div class="tb-apps" id="tb-apps" role="list" aria-label="Fenêtres ouvertes"></div>
    <div class="tb-sys">
      <span class="tb-indicator" aria-live="polite">
        <span class="tb-dot" aria-hidden="true"></span>
        SYS OK
      </span>
      <span class="tb-classif">ALPHA</span>
      <span class="tb-clock" id="os-clock" aria-label="Heure">--:--:--</span>
    </div>
  </footer>

  <!-- Scripts : defer = non-bloquants, exécutés après parsing HTML -->
  <script src="assets/js/lab-access.js" defer></script>
  <script src="assets/js/desktop.js" defer></script>

  <!-- accessibilité clavier : Enter/Space ouvre les icônes -->
  <script>
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      var icon = e.target.closest(".desk-icon");
      if (icon) { e.preventDefault(); icon.dispatchEvent(new MouseEvent("dblclick")); }
    });
  </script>
</body>
</html>
